name: "conduit"

services:
  proxy:
    build:
      context: ..
      dockerfile: ./infra/build.Dockerfile
      args:
        - APP_PATH=proxy
        - APP_PORT=8080
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ALPHA_URL=http://upstream-alpha:3001
      - BETA_URL=http://upstream-beta:3002
    depends_on:
      - upstream-alpha
      - upstream-beta

  upstream-alpha:
    build:
      context: ..
      dockerfile: ./infra/build.Dockerfile
      args:
        - APP_PATH=upstream
        - APP_PORT=3001
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - UPSTREAM_NAME=alpha
      - LATENCY_MS=30
      - JITTER_MS=50
      - ERROR_RATE=0.01

  upstream-beta:
    build:
      context: ..
      dockerfile: ./infra/build.Dockerfile
      args:
        - APP_PATH=upstream
        - APP_PORT=3002
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - UPSTREAM_NAME=beta
      - LATENCY_MS=200
      - JITTER_MS=800
      - ERROR_RATE=0.15

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  grafana-data:
