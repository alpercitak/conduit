version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/proxy
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(docker)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      minor-and-patch:
        update-types: [minor, patch]
