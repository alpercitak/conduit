name: build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.work"
          cache: true
          cache-dependency-path: |
            go.work
            apps/**/*.mod

      - run: go work sync

      # Fail if the workspace was out of sync (e.g. a Dependabot bump raised
      # a module's go version past go.work's) instead of fixing it silently.
      - run: git diff --exit-code

      - run: go vet proxy/... simulator/... upstream/...

      - run: go test -race proxy/...

      - run: make -j$(nproc) build
