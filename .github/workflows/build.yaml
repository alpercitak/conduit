name: build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.work"
          cache: true
          cache-dependency-path: |
            go.work
            apps/**/*.mod

      - run: go work sync

      - run: make -j$(nproc) build
